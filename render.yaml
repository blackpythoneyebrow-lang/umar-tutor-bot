services:
  - type: web
    name: umar-tutor-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: USE_WEBHOOK
        value: "False"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./umar_tutor.db"
