<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Headphones Band -->
  <path d="M 70 120 A 80 80 0 0 1 230 120" fill="none" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <path d="M 75 120 A 75 75 0 0 1 225 120" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Headphones Earcups -->
  <rect x="52" y="105" width="26" height="48" rx="13" fill="url(#blueGlow)"/>
  <rect x="222" y="105" width="26" height="48" rx="13" fill="url(#blueGlow)"/>
  <circle cx="65" cy="129" r="6" fill="#ffffff"/>
  <circle cx="235" cy="129" r="6" fill="#ffffff"/>

  <!-- Robot Head Outer Shell -->
  <rect x="75" y="65" width="150" height="120" rx="45" fill="url(#headGrad)" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Screen Face -->
  <rect x="90" y="80" width="120" height="90" rx="30" fill="url(#faceGrad)"/>

  <!-- Glowing Cyan Eyes (Happy Curved) -->
  <path d="M 108 122 Q 120 108 132 122" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M 168 122 Q 180 108 192 122" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Cute Blush Cheeks -->
  <ellipse cx="106" cy="142" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="194" cy="142" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>

  <!-- Smiling Mouth -->
  <path d="M 142 140 Q 150 148 158 140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Body / Torso -->
  <rect x="100" y="195" width="100" height="75" rx="30" fill="url(#headGrad)" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="150" cy="225" r="14" fill="#0f172a"/>
  <circle cx="150" cy="225" r="8" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Hands holding Book -->
  <ellipse cx="85" cy="220" rx="14" ry="14" fill="url(#headGrad)"/>
  <ellipse cx="215" cy="220" rx="14" ry="14" fill="url(#headGrad)"/>

  <!-- English Book in front -->
  <path d="M 105 210 L 150 220 L 195 210 L 195 265 L 150 275 L 105 265 Z" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <path d="M 150 220 L 150 275" stroke="#93c5fd" stroke-width="2"/>

  <!-- Book details: UK Flag badge -->
  <rect x="135" y="235" width="30" height="20" rx="3" fill="#1e40af"/>
  <path d="M 135 235 L 165 255 M 165 235 L 135 255" stroke="#ffffff" stroke-width="3"/>
  <path d="M 135 235 L 165 255 M 165 235 L 135 255" stroke="#ef4444" stroke-width="1.5"/>
  <path d="M 150 235 L 150 255 M 135 245 L 165 245" stroke="#ffffff" stroke-width="5"/>
  <path d="M 150 235 L 150 255 M 135 245 L 165 245" stroke="#ef4444" stroke-width="3"/>

  <!-- Book text "English" -->
  <text x="150" y="230" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ENGLISH</text>
</svg>
